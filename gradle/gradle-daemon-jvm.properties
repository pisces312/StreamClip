# Daemon JVM criteria for this build (hand-maintained; see docs/toolchain-upgrade-2026-10-agp94-gradle96-jdk25.md).
# toolchainVersion pins the JVM used by the Gradle daemon and takes precedence over JAVA_HOME,
# so it must match the JDK the project is built with (D:\dev\jdk-25 on this machine).
# The toolchainUrl.* entries generated by `gradlew updateDaemonJvm` are deliberately omitted:
# they are foojay download links tied to a specific vendor build, while this project builds
# against a locally installed JDK. Without them Gradle requires a local JDK 25 (JAVA_HOME counts).
toolchainVersion=25
